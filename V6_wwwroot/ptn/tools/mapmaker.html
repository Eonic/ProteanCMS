
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Image Map Maker – NP Links</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: system-ui, Arial, sans-serif;
            margin: 1rem;
        }

        .wrap {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        #stage {
            position: relative;
            display: inline-block;
            border: 1px solid #ccc;
        }

            #stage img {
                display: block;
                max-width: 100%;
                height: auto;
            }

        .box {
            position: absolute;
            border: 2px dashed #8A2BE2;
            background: rgba(138,43,226,0.12);
            pointer-events: none;
        }

        textarea {
            width: 100%;
            height: 360px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .controls {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: .5rem;
        }

        .hint {
            color: #555;
        }

        button {
            padding: .4rem .7rem;
        }
    </style>
</head>
<body>
    <h1>Create HTML Image Map with <code>/NP…</code> links</h1>
    <p class="hint">Click‑drag over each purple square, then enter its label (e.g., <strong>NP251</strong>). Each rectangle becomes an <code>&lt;area&gt;</code> using <code>href=\"/NP251\"</code> and <code>aria-label=\"NP251\"</code>.</p>

    <div class="controls">
        <button id="undoBtn" type="button">Undo last</button>
        <button id="clearBtn" type="button">Clear all</button>
    </div>

    <div class="wrap">
        <div id="stage">
            <!-- Change src if your file/path differs -->
           <img src="image.png"/>
        </div>
        <div style="flex:1; min-width:320px;">
            <label for="output">Generated &lt;map&gt; code</label>
            <p class="hint">Copy this into your page. Ensure your image uses <code>usemap=\"#harbour-map\"</code>.</p>
            <textarea id="output" readonly></textarea>
        </div>
    </div>

    <script>
(function(){
  const stage = document.getElementById('stage');
  const img = document.getElementById('base');
  const output = document.getElementById('output');
  const undoBtn = document.getElementById('undoBtn');
  const clearBtn = document.getElementById('clearBtn');

  let drawing = false;
  let startX = 0, startY = 0;
  let tempBox = null;
  let areas = []; // {label, x1,y1,x2,y2}
  const overlays = []; // DOM boxes for visual reference

  function scaleToNatural(clientX, clientY) {
    const rect = img.getBoundingClientRect();
    const nx = (clientX - rect.left) * (img.naturalWidth / rect.width);
    const ny = (clientY - rect.top)  * (img.naturalHeight / rect.height);
    return [Math.round(nx), Math.round(ny)];
  }

  function createTempBox() {
    const el = document.createElement('div');
    el.className = 'box';
    stage.appendChild(el);
    return el;
  }

  function updateTempBox(clientX, clientY) {
    const rect = img.getBoundingClientRect();
    const left = Math.min(startX, clientX);
    const top  = Math.min(startY, clientY);
    const w = Math.abs(clientX - startX);
    const h = Math.abs(clientY - startY);
    Object.assign(tempBox.style, {
      left: (left - rect.left) + 'px',
      top:  (top  - rect.top)  + 'px',
      width:  w + 'px',
      height: h + 'px'
    });
  }

  stage.addEventListener('mousedown', (e) => {
    const r = img.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    drawing = true;
    startX = e.clientX;
    startY = e.clientY;
    tempBox = createTempBox();
    updateTempBox(e.clientX, e.clientY);
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!drawing) return;
    updateTempBox(e.clientX, e.clientY);
  });

  window.addEventListener('mouseup', (e) => {
    if (!drawing) return;
    drawing = false;

    const [x1n, y1n] = scaleToNatural(startX, startY);
    const [x2n, y2n] = scaleToNatural(e.clientX, e.clientY);
    const x1 = Math.max(0, Math.min(x1n, x2n));
    const y1 = Math.max(0, Math.min(y1n, y2n));
    const x2 = Math.min(img.naturalWidth,  Math.max(x1n, x2n));
    const y2 = Math.min(img.naturalHeight, Math.max(y1n, y2n));

    const label = prompt('Label for this square (e.g., NP251):', '');
    if (!label) {
      tempBox.remove();
      tempBox = null;
      return;
    }

    // Convert tempBox into a persistent overlay for visual feedback
    const rectBox = document.createElement('div');
    rectBox.className = 'box';
    rectBox.style.left = tempBox.style.left;
    rectBox.style.top = tempBox.style.top;
    rectBox.style.width = tempBox.style.width;
    rectBox.style.height = tempBox.style.height;
    rectBox.title = label.trim();
    overlays.push(rectBox);
    stage.appendChild(rectBox);
    tempBox.remove();
    tempBox = null;

    areas.push({ label: label.trim(), x1, y1, x2, y2 });
    render();
  });

  function render() {
    const lines = [];
    lines.push('<map name="harbour-map">');
    for (const a of areas) {
      const coords = [a.x1, a.y1, a.x2, a.y2].join(',');
      // IMPORTANT: produce /NP251 and aria-label="NP251"
      lines.push(`  <area shape="rect" coords="${coords}" href="/${a.label}" aria-label="${a.label}" alt="${a.label}" title="${a.label}"'click', () => {
    if (!areas.length) return;
    areas.pop();
    const box = overlays.pop();
    if (box) box.remove();
    render();
  });

  clearBtn.addEventListener('click', () => {
    areas = [];
    overlays.forEach(b => b.remove());
    overlays.length = 0;
    render();
  });

  function syncStageSize() {
    const r = img.getBoundingClientRect();
    stage.style.width = r.width + 'px';
    stage.style.height = r.height + 'px';
  }
  window.addEventListener('resize', syncStageSize);
  img.addEventListener('load', () => {
    syncStageSize();
    render();
  });
})();
    </script>
</body>
</html>
